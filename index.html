<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel BikeFix</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- App styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase JS SDK (must be before app.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main>
        <div id="app-container">
            <!-- Login / Access‑code screen -->
            <section id="view-login" class="view active">
                <div class="code-entry-box reveal anim-up">
                    <h2>Wprowadź kod</h2>
                    <form id="code-form">
                        <div class="input-group">
                            <input type="text" id="access-code"
                                   placeholder="Kod klienta lub serwisanta"
                                   autocomplete="off" required>
                        </div>
                        <button type="submit" class="btn btn--primary">Sprawdź</button>
                        <p id="code-error-msg" class="error-msg hidden">Niepoprawny kod.</p>
                    </form>
                </div>
            </section>

            <!-- Customer view (filled by JS) -->
            <section id="view-customer" class="view hidden"></section>

            <!-- Mechanic view (filled by JS) -->
            <section id="view-mechanic" class="view hidden"></section>
        </div>
    </main>

    <!-- App script (deferred) -->
    <script src="app.js" defer></script>
</body>
</html>
